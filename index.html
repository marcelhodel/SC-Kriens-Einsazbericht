@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.upd{background:var(--accent-soft);color:var(--ink);font-size:14px}
.upd .wrap{display:flex;gap:10px;align-items:center;padding-block:8px}
.upd span{flex:1}
#netBadge{background:var(--warn);color:#fff}

/* Layout: one mobile column of fold-out report sections, sticky top bar, fixed export bar at the bottom */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16201C; --muted:#5C6B65; --line:#D6DDDA;
  --accent:#1E6B47; --accent-ink:#FFFFFF; --accent-soft:#E2EFE8; --warn:#B4441A; --chip:#EDF1EF;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --ink:#E6ECE9; --muted:#97A59F; --line:#2B3632;
  --accent:#4FB585; --accent-ink:#06130D; --accent-soft:#1E3329; --warn:#F08A5D; --chip:#222C28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --ink:#E6ECE9; --muted:#97A59F; --line:#2B3632;
  --accent:#4FB585; --accent-ink:#06130D; --accent-soft:#1E3329; --warn:#F08A5D; --chip:#222C28; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{flex:1;min-width:0}
.logo{width:34px;height:40px;object-fit:contain;flex:none}
.brand b{display:block;font-size:17px;letter-spacing:.01em}
.brand span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding-block:16px 120px;display:grid;gap:12px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:600;font-size:16px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
summary .ttl{flex:1}
.badge{font-size:12px;font-weight:500;color:var(--muted);background:var(--chip);padding:2px 8px;border-radius:99px}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.body{padding:0 16px 16px;display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-weight:500;min-height:44px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=email],input[type=text],input[type=date],input[type=time],input[type=number],textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.vs{display:flex;align-items:center;gap:8px}
.vs .home{font-weight:700;white-space:nowrap}
.vs input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px dashed var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:5px 10px;cursor:pointer}
.chip:active{background:var(--accent-soft)}
button.btn{font:inherit;font-weight:600;border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.btn.danger{color:var(--warn)}
button.btn.sm{min-height:36px;font-size:14px;padding:0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.item-head{display:flex;align-items:center;gap:8px}
.num{font-family:var(--mono);font-size:14px;min-width:28px;height:28px;border-radius:6px;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.item-head .sp{flex:1}
.time{display:flex;gap:6px;align-items:center}
.time input{width:auto;flex:1;font-family:var(--mono)}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:86px;height:86px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:26px;cursor:pointer;padding:0}
.gal{display:grid;gap:12px}
.gal .g{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start}
.gal .g img{width:110px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.gal .g .c{display:grid;gap:6px;min-width:0}
.hint{font-size:13px;color:var(--muted)}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
input[type=file]{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.bar .st{flex:1;font-size:13px;color:var(--muted);min-width:0}
.bar .btn{min-width:84px}.bar .btn.pri{min-width:128px}
@media (max-width:440px){.bar .st{font-size:12px}}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,15,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .pan{background:var(--surface);width:100%;max-width:760px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h2{margin:0;font-size:18px}
.rep{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.rep.cur{border-color:var(--accent)}
.rep .t{flex:1;min-width:0}
.rep .t b{display:block;font-size:15px}
.rep .t span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:20px;height:20px}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-style:solid;border-color:var(--accent)}
.chip .x{margin-left:6px;font-weight:700;color:var(--warn)}
.chip.sel .x{color:var(--accent-ink)}
.teamrow{display:flex;flex-wrap:wrap;gap:8px}
.teamrow input{flex:1 1 180px;min-width:0}
.att{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.att .ic{font-family:var(--mono);font-size:11px;font-weight:500;width:42px;height:42px;border-radius:6px;background:var(--chip);display:flex;align-items:center;justify-content:center;text-transform:uppercase;overflow:hidden;flex:none}
.att .ic img{width:42px;height:42px;object-fit:cover}
.att .t{flex:1 1 140px;min-width:0}
.att .t b{display:block;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.att .t span{font-size:12px;color:var(--muted)}
.warnline{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const chDate=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return d+"."+m+"."+y};

const TEXTS=[
 ["ausgangslage","Ausgangslage",["Es wird mit ca. ___ Zuschauern gerechnet.","Aus ___ sind ca. ___ Fans angemeldet.","Anreise mit ÖV.","Transport BHF Luzern – Kriens – BHF Luzern mit Bus."]],
 ["briefing","Briefing / Informationen",["Polizei","SiVe SC Kriens","FaVe SC Kriens","FaVe Gast","Spotter Gast","Spotter LU","Absprache mit den Involvierten,","keine besonderen Massnahmen vorgesehen."]],
 ["anreise","Anreise",["Die Anreise erfolgt ohne Probleme."]],
 ["spiel","Während dem Spiel",["Keine besonderen Vorkommnisse.","Ein Rettungswagen musste bestellt werden.","Pyrotechnik auf das Feld geworfen durch Gast Fans.","Pyrotechnik auf das Feld geworfen durch Heimfans.","Kinder auf dem Feld nach dem Spiel."]],
 ["halbzeit","Rapport Halbzeit",["Polizei Luzern","Polizei Spotter","TPO","SiVe SC Kriens","FaVe SC Kriens","SiVe Gast","FaVe Gast"]],
 ["abreise","Nach dem Spiel / Abreise",["Die Abreise verläuft ohne Probleme.","Die Zuschauer beider Fanlager haben das Stadion zügig verlassen."]],
 ["bemerkungen","Bemerkungen",["Keine Anmerkungen"]]
];
const LIST_CHIPS={briefing:1,halbzeit:1};

function newReport(){
  return {id:uid(),updated:Date.now(),
    game:{gegner:"",datum:todayISO(),zeit:"20:15",resultat:"",zuschauer:"",gast:"",wetter:"",inspektion:"keine gemeldet"},
    texts:{ausgangslage:"",briefing:"",anreise:"",spiel:"",halbzeit:"",abreise:"",bemerkungen:""},
    events:[],maengel:[],photos:[],attachments:[],berichtDatum:todayISO(),verfasser:"Marcel Hodel"};
}
function norm(r){if(r){r.events=r.events||[];r.maengel=r.maengel||[];r.photos=r.photos||[];r.attachments=r.attachments||[]}return r}

/* ---------- gespeicherte Gegner ---------- */
let teams=[],teamEdit=false;
function saveTeams(){teams.sort((a,b)=>a.localeCompare(b,"de"));try{localStorage.setItem("sck-teams",JSON.stringify(teams))}catch(e){}}
function loadTeams(all){let t=null;try{t=JSON.parse(localStorage.getItem("sck-teams")||"null")}catch(e){}
  if(!Array.isArray(t)){t=[];all.forEach(r=>{const n=((r.game&&r.game.gegner)||"").trim();if(n&&!t.some(x=>x.toLowerCase()===n.toLowerCase()))t.push(n)})}
  teams=t;saveTeams()}
function addTeam(n){n=(n||"").trim();if(!n||teams.some(t=>t.toLowerCase()===n.toLowerCase()))return false;teams.push(n);saveTeams();return true}

/* ---------- storage (IndexedDB on this device, falls back to memory) ---------- */
let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("sck-einsatz",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("reports",{keyPath:"id"});
  r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res();}catch(e){res()}})}
const mem={};
function dbAll(){return new Promise(res=>{if(!idb)return res(Object.values(mem));try{const q=idb.transaction("reports").objectStore("reports").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res(Object.values(mem))}})}
function dbPut(r){mem[r.id]=r;return new Promise(res=>{if(!idb)return res(false);try{const t=idb.transaction("reports","readwrite");t.objectStore("reports").put(r);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
function dbDel(id){delete mem[id];return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction("reports","readwrite");t.objectStore("reports").delete(id);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

let R=null, saveTimer=null;
function touch(){R.updated=Date.now();clearTimeout(saveTimer);$("#saveState").textContent="Speichert …";
  saveTimer=setTimeout(async()=>{const ok=await dbPut(R);$("#saveState").textContent=ok?"Gespeichert "+nowHM()+" · auf diesem Gerät":"Nicht gespeichert – Speicher im Browser blockiert";updateLabel();updateBadges()},400)}

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
function gegnerName(r){return (r.game.gegner||"").trim()||"Gegner"}
function updateLabel(){$("#curLabel").textContent="vs. "+gegnerName(R)+(R.game.datum?" · "+chDate(R.game.datum):"")}

/* ---------- render ---------- */
const openState={spiel:true};
function sec(key,title,badge,inner){
  return `<details class="sec" data-sec="${key}" ${openState[key]?"open":""}><summary><span class="ttl">${title}</span><span class="badge" data-badge="${key}">${badge||""}</span></summary><div class="body">${inner}</div></details>`;
}
function field(path,label,type,val,extra){return `<label class="f"><span>${label}</span><input id="f-${path.replace(/\./g,"-")}" type="${type}" data-path="${path}" value="${esc(val)}" ${extra||""}></label>`}
function photosHTML(list,owner){return `<div class="photos">${list.map(p=>`<div class="ph"><img src="${p.src}" alt="Foto"><button type="button" data-act="delphoto" data-owner="${owner}" data-pid="${p.id}" aria-label="Foto entfernen">×</button></div>`).join("")}</div>
  <div class="row"><button class="btn sm" type="button" data-act="cam" data-owner="${owner}">Kamera</button><button class="btn sm" type="button" data-act="lib" data-owner="${owner}">Fotos wählen</button></div>`}

function render(){
  const g=R.game;
  let h="";
  h+=sec("spiel","Begegnung","",`
    <div class="vs"><span class="home">SC Kriens vs.</span><input id="f-gegner" type="text" data-path="game.gegner" value="${esc(g.gegner)}" placeholder="z.B. FC Winterthur" aria-label="Gegner"></div>
    <div class="chips">${teams.length?teams.map(t=>`<button type="button" class="chip${t===(g.gegner||"").trim()?" sel":""}" data-act="${teamEdit?"teamdel":"team"}" data-v="${esc(t)}">${esc(t)}${teamEdit?'<span class="x" aria-hidden="true">×</span>':""}</button>`).join(""):`<span class="hint">Noch keine gespeicherten Gegner. Erfasste Gegner werden hier gespeichert.</span>`}</div>
    ${teamEdit?`<div class="hint">Antippen löscht den Gegner aus der Liste. Bestehende Berichte bleiben unverändert.</div>`:""}
    <div class="teamrow"><input id="f-newteam" type="text" placeholder="Weiteren Gegner erfassen" aria-label="Weiteren Gegner erfassen"><button class="btn sm" type="button" data-act="teamadd">Hinzufügen</button><button class="btn sm ghost" type="button" data-act="teamedit">${teamEdit?"Fertig":"Liste bearbeiten"}</button></div>
    <div class="grid2">${field("game.datum","Datum","date",g.datum)}${field("game.zeit","Anpfiff","time",g.zeit)}</div>
    <div class="grid2">${field("game.resultat","Resultat","text",g.resultat,'placeholder="2:0" inputmode="text"')}${field("game.wetter","Wetter","text",g.wetter,'placeholder="bewölkt, 32°C"')}</div>
    <div class="grid2">${field("game.zuschauer","Zuschauer total","number",g.zuschauer,'inputmode="numeric"')}${field("game.gast","davon Gast (ca.)","number",g.gast,'inputmode="numeric"')}</div>
    <div class="f" style="display:grid;gap:6px"><span style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Inspektion</span>
      <div class="seg" role="radiogroup" aria-label="Inspektion">${["keine gemeldet","gemeldet"].map(v=>`<button type="button" role="radio" aria-checked="${g.inspektion===v}" class="${g.inspektion===v?"on":""}" data-act="insp" data-v="${v}">${v==='gemeldet'?'Gemeldet':'Keine gemeldet'}</button>`).join("")}</div></div>
    ${g.inspektion==="gemeldet"?`<div class="grid2">${field("game.inspName","Name","text",g.inspName||"",'autocomplete="family-name"')}${field("game.inspVorname","Vorname","text",g.inspVorname||"",'autocomplete="given-name"')}</div>
    ${field("game.inspMail","E-Mail Inspizient","email",g.inspMail||"",'inputmode="email" autocomplete="email" placeholder="name@beispiel.ch"')}`:""}
  `);
  h+=sec("lage","Lage &amp; Verlauf","",TEXTS.map(([k,l,chips])=>`
    <label class="f"><span>${l}</span><textarea id="t-${k}" data-path="texts.${k}" rows="3">${esc(R.texts[k])}</textarea></label>
    <div class="chips">${chips.map(c=>`<button type="button" class="chip" data-act="chip" data-k="${k}" data-v="${esc(c)}">+ ${esc(c.replace("Gast",gegnerName(R)==="Gegner"?"Gast":gegnerName(R)))}</button>`).join("")}</div>`).join(""));
  h+=sec("ev","Ereignisse","",`
    ${R.events.length?"":`<div class="empty">Noch keine Ereignisse. Zeit, Beschreibung und Fotos pro Ereignis erfassen.</div>`}
    ${R.events.map((e,i)=>`<div class="item">
      <div class="item-head"><span class="num">${i+1}</span>
        <div class="time"><input id="ev-z-${e.id}" type="text" data-ev="${e.id}" data-k="zeit" value="${esc(e.zeit)}" placeholder="20:30 / 21:00" aria-label="Zeit"><button class="btn sm" type="button" data-act="now" data-id="${e.id}">Jetzt</button></div>
        <span class="sp"></span><button class="btn sm ghost danger" type="button" data-act="delev" data-id="${e.id}">Löschen</button></div>
      <textarea id="ev-t-${e.id}" data-ev="${e.id}" data-k="text" rows="3" placeholder="Was ist passiert, wer war beteiligt, welche Massnahmen?">${esc(e.text)}</textarea>
      ${photosHTML(e.photos,"ev:"+e.id)}
    </div>`).join("")}
    <div class="row"><button class="btn" type="button" data-act="addev">+ Ereignis erfassen</button><button class="btn ghost" type="button" data-act="importev">Aus letztem Bericht übernehmen</button></div>`);
  h+=sec("ma","Mängel / Anmerkungen Stadion &amp; Betrieb","",`
    ${R.maengel.length?"":`<div class="empty">Keine Mängel erfasst.</div>`}
    ${R.maengel.map((m,i)=>`<div class="item">
      <div class="item-head"><span class="num">${i+1}</span><span class="sp"></span>
        <button class="btn sm ghost" type="button" data-act="up" data-id="${m.id}" ${i===0?"disabled":""} aria-label="Nach oben">↑</button>
        <button class="btn sm ghost danger" type="button" data-act="delma" data-id="${m.id}">Löschen</button></div>
      <textarea id="ma-t-${m.id}" data-ma="${m.id}" rows="3" placeholder="z.B. Fluchtweg Sektor E lässt sich nicht öffnen">${esc(m.text)}</textarea>
      ${photosHTML(m.photos,"ma:"+m.id)}
    </div>`).join("")}
    <div class="row"><button class="btn" type="button" data-act="addma">+ Mangel erfassen</button><button class="btn ghost" type="button" data-act="importma">Aus letztem Bericht übernehmen</button></div>`);
  h+=sec("fo","Fotodokumentation","",`
    <div class="hint">Allgemeine Fotos ohne Bezug zu einem Ereignis oder Mangel. Sie erscheinen am Ende des Berichts.</div>
    <div class="gal">${R.photos.map(p=>`<div class="g"><img src="${p.src}" alt="Foto"><div class="c">
      <input id="pc-${p.id}" type="text" data-pc="${p.id}" value="${esc(p.caption)}" placeholder="Bildlegende">
      <div><button class="btn sm ghost danger" type="button" data-act="delphoto" data-owner="gen" data-pid="${p.id}">Entfernen</button></div></div></div>`).join("")}</div>
    <div class="row"><button class="btn sm" type="button" data-act="cam" data-owner="gen">Kamera</button><button class="btn sm" type="button" data-act="lib" data-owner="gen">Fotos wählen</button></div>`);
  h+=sec("ab","Abschluss","",`<div class="grid2">${field("berichtDatum","Berichtsdatum","date",R.berichtDatum)}${field("verfasser","Verfasser","text",R.verfasser)}</div>`);
  h+=sec("an","Anhänge","",`
    <div class="hint">Beliebige Dateien anfügen, z.B. Pläne, Listen, Polizeirapporte. PDF-Dateien und Bilder werden im PDF-Bericht hinten angehängt, alle Anhänge sind im Bericht aufgelistet.</div>
    ${R.attachments.length?R.attachments.map(a=>`<div class="att"><div class="ic">${a.img?`<img src="${a.img.src}" alt="">`:esc((extOf(a.name)||"Datei").slice(0,5))}</div>
      <div class="t"><b>${esc(a.name)}</b><span>${fmtSize(a.size)}</span></div>
      <button class="btn sm" type="button" data-act="saveatt" data-id="${a.id}">Speichern</button><button class="btn sm ghost danger" type="button" data-act="delatt" data-id="${a.id}">Entfernen</button></div>`).join(""):`<div class="empty">Keine Anhänge.</div>`}
    <div class="row"><button class="btn" type="button" data-act="attach">+ Datei anfügen</button></div>`);
  $("#app").innerHTML=h;
  updateLabel();updateBadges();
}
function updateBadges(){
  const set=(k,txt,ok)=>{const b=document.querySelector(`[data-badge="${k}"]`);if(b){b.textContent=txt;b.classList.toggle("ok",!!ok)}};
  const g=R.game;set("spiel",g.gegner?(g.resultat?g.resultat:"offen"):"Gegner fehlt",!!(g.gegner&&g.resultat));
  const filled=TEXTS.filter(([k])=>R.texts[k].trim()).length;set("lage",filled+" / "+TEXTS.length,filled===TEXTS.length);
  const cnt=a=>a.reduce((n,x)=>n+x.photos.length,0);
  set("ev",R.events.length+" Einträge"+(cnt(R.events)?" · "+cnt(R.events)+" Fotos":""),R.events.length>0);
  set("ma",R.maengel.length+" Punkte"+(cnt(R.maengel)?" · "+cnt(R.maengel)+" Fotos":""),R.maengel.length>0);
  set("fo",R.photos.length+" Fotos",R.photos.length>0);
  set("ab",chDate(R.berichtDatum),!!R.verfasser);
  set("an",R.attachments.length+(R.attachments.length===1?" Datei":" Dateien"),R.attachments.length>0);
}
function setPath(obj,path,v){const ks=path.split(".");let o=obj;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=v}

/* ---------- events ---------- */
$("#app").addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.sec)openState[d.dataset.sec]=d.open},true);
$("#app").addEventListener("input",e=>{const t=e.target;
  if(t.dataset.path){setPath(R,t.dataset.path,t.value)}
  else if(t.dataset.ev){const ev=R.events.find(x=>x.id===t.dataset.ev);if(ev)ev[t.dataset.k]=t.value}
  else if(t.dataset.ma){const m=R.maengel.find(x=>x.id===t.dataset.ma);if(m)m.text=t.value}
  else if(t.dataset.pc){const p=R.photos.find(x=>x.id===t.dataset.pc);if(p)p.caption=t.value}
  else return;
  touch();
});
$("#app").addEventListener("change",e=>{if(e.target.dataset.path==="game.gegner"){addTeam(e.target.value);render()}});
$("#app").addEventListener("keydown",e=>{if(e.target.id==="f-newteam"&&e.key==="Enter"){e.preventDefault();doAddTeam()}});
function doAddTeam(){const inp=$("#f-newteam");const n=(inp.value||"").trim();if(!n){inp.focus();return}
  if(addTeam(n)){render();toast(n+" gespeichert.")}else{inp.value="";toast(n+" ist bereits in der Liste.")}}
let pendingOwner=null;
$("#app").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="chip"){const k=b.dataset.k;let v=b.dataset.v;if(gegnerName(R)!=="Gegner")v=v.replace("Gast",gegnerName(R));
    const cur=R.texts[k];const sep=!cur?"":LIST_CHIPS[k]?"\n":(/\s$/.test(cur)?"":" ");R.texts[k]=cur+sep+v;
    const ta=$("#t-"+k);ta.value=R.texts[k];touch();return}
  if(a==="addev"){R.events.push({id:uid(),zeit:nowHM(),text:"",photos:[]});openState.ev=true;render();touch();const l=R.events[R.events.length-1];setTimeout(()=>{const t=$("#ev-t-"+l.id);t&&t.focus()},30);return}
  if(a==="now"){const ev=R.events.find(x=>x.id===id);ev.zeit=nowHM();$("#ev-z-"+id).value=ev.zeit;touch();return}
  if(a==="delev"){if(!confirmTwice(b))return;R.events=R.events.filter(x=>x.id!==id);render();touch();return}
  if(a==="addma"){R.maengel.push({id:uid(),text:"",photos:[]});openState.ma=true;render();touch();const l=R.maengel[R.maengel.length-1];setTimeout(()=>{const t=$("#ma-t-"+l.id);t&&t.focus()},30);return}
  if(a==="delma"){if(!confirmTwice(b))return;R.maengel=R.maengel.filter(x=>x.id!==id);render();touch();return}
  if(a==="up"){const i=R.maengel.findIndex(x=>x.id===id);if(i>0){[R.maengel[i-1],R.maengel[i]]=[R.maengel[i],R.maengel[i-1]];render();touch()}return}
  if(a==="importma"){importMaengel();return}
  if(a==="insp"){R.game.inspektion=b.dataset.v;render();touch();return}
  if(a==="team"){R.game.gegner=b.dataset.v;render();touch();return}
  if(a==="teamdel"){const v=b.dataset.v;teams=teams.filter(t=>t!==v);saveTeams();render();toast(v+" aus der Liste gelöscht.");return}
  if(a==="teamedit"){teamEdit=!teamEdit;render();return}
  if(a==="teamadd"){doAddTeam();return}
  if(a==="attach"){const inp=$("#fileAny");inp.value="";inp.click();return}
  if(a==="delatt"){if(!confirmTwice(b))return;R.attachments=R.attachments.filter(x=>x.id!==id);render();touch();return}
  if(a==="saveatt"){const at=R.attachments.find(x=>x.id===id);if(at)saveBlob(at.name,new Blob([b64ToBytes(at.data)]),"Anhang");return}
  if(a==="importev"){importEvents();return}
  if(a==="cam"||a==="lib"){pendingOwner=b.dataset.owner;const inp=a==="cam"?$("#fileCam"):$("#fileLib");inp.value="";inp.click();return}
  if(a==="delphoto"){const list=ownerList(b.dataset.owner);const i=list.findIndex(p=>p.id===b.dataset.pid);if(i>-1)list.splice(i,1);render();touch();return}
});
function confirmTwice(b){if(b.dataset.armed){return true}b.dataset.armed="1";const old=b.textContent;b.textContent="Sicher?";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=old}},2500);return false}
function ownerList(owner){if(owner==="gen")return R.photos;const[t,id]=owner.split(":");const arr=t==="ev"?R.events:R.maengel;const o=arr.find(x=>x.id===id);return o?o.photos:[]}

async function onFiles(files){if(!files||!files.length||!pendingOwner)return;const owner=pendingOwner;
  $("#saveState").textContent="Fotos werden verarbeitet …";
  for(const f of files){try{const p=await shrink(f);p.caption="";ownerList(owner).push(p)}catch(err){toast("Ein Foto konnte nicht gelesen werden ("+f.name+").")}}
  render();touch();
}
$("#fileLib").addEventListener("change",e=>onFiles(e.target.files));
function fmtSize(n){return n>=1048576?(n/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1024))+" KB"}
function extOf(name){const m=/\.([^.]+)$/.exec(name||"");return m?m[1].toLowerCase():""}
function isPdfAtt(a){return a.type==="application/pdf"||extOf(a.name)==="pdf"}
function readAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}
async function onAttach(files){if(!files||!files.length)return;$("#saveState").textContent="Dateien werden angefügt …";
  for(const f of files){
    if(f.size>25*1048576){toast(f.name+" ist grösser als 25 MB und wurde nicht angefügt.");continue}
    try{const a={id:uid(),name:f.name||"Datei",type:f.type||"",size:f.size,data:await readAsDataURL(f)};
      if(/^image\//.test(a.type)&&!/svg/.test(a.type)){try{const p=await shrink(f);a.img={src:p.src,w:p.w,h:p.h}}catch(e){}}
      R.attachments.push(a)}catch(err){toast(f.name+" konnte nicht gelesen werden.")}}
  openState.an=true;render();touch()}
$("#fileAny").addEventListener("change",e=>onAttach(e.target.files));
$("#fileCam").addEventListener("change",e=>onFiles(e.target.files));
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const M=1600;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);res({id:uid(),src:c.toDataURL("image/jpeg",0.82),w,h})};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

async function importEvents(){const all=(await dbAll()).filter(r=>r.id!==R.id&&r.events&&r.events.length).sort((a,b)=>(b.game.datum||"").localeCompare(a.game.datum||"")||b.updated-a.updated);
  if(!all.length){toast("Kein früherer Bericht mit Ereignissen gefunden.");return}
  const src=all[0];const have=new Set(R.events.map(e=>e.text.trim()));let n=0;
  src.events.forEach(e=>{if(!have.has(e.text.trim())){R.events.push({id:uid(),zeit:e.zeit,text:e.text,photos:[]});n++}});
  openState.ev=true;render();touch();toast(n+" Ereignisse aus dem Bericht vom "+chDate(src.game.datum)+" übernommen.");}
async function importMaengel(){const all=(await dbAll()).filter(r=>r.id!==R.id&&r.maengel&&r.maengel.length).sort((a,b)=>(b.game.datum||"").localeCompare(a.game.datum||"")||b.updated-a.updated);
  if(!all.length){toast("Kein früherer Bericht mit Mängeln gefunden.");return}
  const src=all[0];const have=new Set(R.maengel.map(m=>m.text.trim()));let n=0;
  src.maengel.forEach(m=>{if(!have.has(m.text.trim())){R.maengel.push({id:uid(),text:m.text,photos:[]});n++}});
  openState.ma=true;render();touch();toast(n+" Mängel aus dem Bericht vom "+chDate(src.game.datum)+" übernommen.");}

/* ---------- reports sheet ---------- */
$("#btnReports").addEventListener("click",openSheet);
$("#btnNew").addEventListener("click",()=>{
  $("#sheetPan").innerHTML=`<div class="row"><h2 style="flex:1">Neuer Bericht</h2><button class="btn sm ghost" type="button" data-s="close">Abbrechen</button></div>
  <div class="hint">Der aktuelle Bericht (vs. ${esc(gegnerName(R))}${R.game.datum?", "+chDate(R.game.datum):""}) bleibt unter „Berichte“ gespeichert und kann jederzeit wieder geöffnet werden.</div>
  <label class="check"><input type="checkbox" id="carry"> Mängel des letzten Berichts übernehmen</label>
  <button class="btn pri" type="button" data-s="new">Neuen Bericht anlegen</button>`;
  $("#sheet").hidden=false;});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("#sheet").hidden=true});
async function openSheet(){const all=(await dbAll()).sort((a,b)=>(b.game.datum||"").localeCompare(a.game.datum||"")||b.updated-a.updated);
  $("#sheetPan").innerHTML=`<div class="row"><h2 style="flex:1">Berichte</h2><button class="btn sm ghost" type="button" data-s="close">Schliessen</button></div>
  <button class="btn pri" type="button" data-s="new">+ Neuer Bericht</button>
  <label class="check"><input type="checkbox" id="carry"> Mängel des letzten Berichts übernehmen</label>
  ${all.map(r=>`<div class="rep ${r.id===R.id?"cur":""}"><div class="t"><b>vs. ${esc(gegnerName(r))}</b><span>${chDate(r.game.datum)||"ohne Datum"} · ${(r.events||[]).length} Ereignisse · ${(r.maengel||[]).length} Mängel${(r.attachments||[]).length?" · "+r.attachments.length+" Anhänge":""}</span></div>
    ${r.id===R.id?`<span class="badge ok">offen</span>`:`<button class="btn sm" type="button" data-s="open" data-id="${r.id}">Öffnen</button>`}
    <button class="btn sm ghost danger" type="button" data-s="del" data-id="${r.id}">Löschen</button></div>`).join("")}
  <div class="hint">Berichte und Fotos werden nur in diesem Browser auf diesem Gerät gespeichert. Den fertigen Bericht als PDF oder Word-Datei sichern.</div>
  <h2 style="margin-top:8px">Sicherung</h2>
  <div class="hint">Alle Berichte, Fotos, Anhänge und Gegner als eine Datei sichern, z.B. für ein neues Gerät oder vor dem Löschen des Browserverlaufs.</div>
  <div class="row"><button class="btn" type="button" data-s="backup">Sicherung exportieren</button><button class="btn" type="button" data-s="restore">Sicherung importieren</button></div>
  ${window.pwaSheetHTML?window.pwaSheetHTML():""}`;
  $("#sheet").hidden=false;}
$("#sheetPan").addEventListener("click",async e=>{const b=e.target.closest("[data-s]");if(!b)return;const s=b.dataset.s;
  if(s==="close"){$("#sheet").hidden=true;return}
  if(s==="backup"){exportBackup();return}
  if(s==="restore"){const inp=$("#fileBackup");inp.value="";inp.click();return}
  if(s==="install"&&window.pwaInstall){window.pwaInstall();return}
  if(s==="new"){clearTimeout(saveTimer);const okSave=await dbPut(R);if(!okSave&&idb){toast("Aktueller Bericht konnte nicht gespeichert werden. Bitte erneut versuchen.");return}const carry=$("#carry").checked;const prev=R;R=newReport();
    if(carry&&prev.maengel.length)R.maengel=prev.maengel.map(m=>({id:uid(),text:m.text,photos:[]}));
    await dbPut(R);lsSet("sck-current",R.id);openState.spiel=true;render();$("#sheet").hidden=true;toast("Neuer Bericht angelegt. Der vorherige ist unter „Berichte“ gespeichert.");return}
  if(s==="open"){clearTimeout(saveTimer);await dbPut(R);const all=await dbAll();const r=all.find(x=>x.id===b.dataset.id);if(r){R=norm(r);lsSet("sck-current",R.id);render();$("#sheet").hidden=true}return}
  if(s==="del"){if(!confirmTwice(b))return;const id=b.dataset.id;await dbDel(id);
    if(id===R.id){const rest=(await dbAll()).sort((a,b)=>b.updated-a.updated);R=norm(rest[0])||newReport();await dbPut(R);lsSet("sck-current",R.id);render()}
    openSheet();return}
});

function b64ToBytes(dataUrl){const b=atob(dataUrl.split(",")[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function buildDocx(R,D){
  const {Document,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,ShadingType,BorderStyle,AlignmentType,Header,Footer,ImageRun,PageNumber,VerticalAlign,TabStopType}=D;
  const FULL=9638, GREY="E8EAED", B={style:BorderStyle.SINGLE,size:4,color:"808080"};
  const borders={top:B,bottom:B,left:B,right:B};
  const M={top:70,bottom:70,left:110,right:110};
  const fmt=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return d+"."+m+"."+y};
  const P=(text,o={})=>new Paragraph({spacing:{after:o.after??0},alignment:o.align,children:[new TextRun({text:String(text??""),bold:o.bold,size:o.size,color:o.color})]});
  const paras=(text,o)=>{const lines=String(text||"").split(/\n/);return lines.map(l=>P(l,o))};
  const cell=(children,w,o={})=>new TableCell({width:{size:w,type:WidthType.DXA},borders,margins:M,columnSpan:o.span,verticalAlign:o.va,
     shading:o.fill?{fill:o.fill,type:ShadingType.CLEAR,color:"auto"}:undefined,children:Array.isArray(children)?children:[children]});
  const img=(p,maxW)=>{const w=Math.min(maxW,p.w);const h=Math.round(p.h*w/p.w);return new ImageRun({data:b64ToBytes(p.src),transformation:{width:w,height:h}})};
  const g=R.game, gegner=(g.gegner||"").trim()||"—";
  const out=[];
  out.push(new Paragraph({spacing:{before:120,after:240},children:[new TextRun({text:"Einsatzbericht Heimspiel",bold:true,size:32})]}));
  // Begegnung
  const W3=[3000,3600,3038];
  const r3=(l,a,b,bold)=>new TableRow({children:[cell(P(l,{bold:true}),W3[0],{fill:GREY}),cell(P(a,{bold}),W3[1]),cell(paras(b),W3[2])]});
  const inspT=g.inspektion==="gemeldet"?[[g.inspName,g.inspVorname].filter(Boolean).join(" "),g.inspMail].filter(Boolean).join("\n"):"";
  out.push(new Table({width:{size:FULL,type:WidthType.DXA},columnWidths:W3,rows:[
    new TableRow({children:[cell(P("Begegnung:",{bold:true}),W3[0],{fill:GREY}),cell(new Paragraph({children:[new TextRun({text:"SC Kriens  vs.  "+gegner,bold:true})]}),W3[1]+W3[2],{span:2})]}),
    r3("Datum/Zeit:",fmt(g.datum),g.zeit?g.zeit+" Uhr":""),
    r3("Resultat:",g.resultat,""),
    r3("Anzahl Zuschauer (Total):",g.zuschauer,g.gast?"(davon Gast) ca. "+g.gast:""),
    r3("Wetter:",g.wetter,""),
    r3("Inspektion:",g.inspektion,inspT)
  ]}));
  const TX=[["ausgangslage","Ausgangslage:"],["briefing","Briefing/Informationen:"],["anreise","Anreise:"],["spiel","während dem Spiel:"],["halbzeit","Rapport Halbzeit:"],["abreise","nach dem Spiel / Abreise:"],["bemerkungen","Bemerkungen:"]];
  TX.forEach(([k,l])=>{out.push(P("",{after:120}));
    out.push(new Table({width:{size:FULL,type:WidthType.DXA},columnWidths:[FULL],rows:[
      new TableRow({children:[cell(P(l,{bold:true}),FULL,{fill:GREY})]}),
      new TableRow({children:[cell(paras(R.texts[k]||""),FULL)]})]}))});
  out.push(P("",{after:120}));
  out.push(new Table({width:{size:FULL,type:WidthType.DXA},columnWidths:[FULL],rows:[
    new TableRow({children:[cell(P("Datum: "+fmt(R.berichtDatum)+"      "+(R.verfasser||"")),FULL)]})]}));
  // Ereignisse
  const PHW=2600, IMGPX=160;

      new TableRow({tableHeader:true,children:[cell(P("Ereignisse:",{bold:true}),WE[0]+WE[1],{fill:GREY,span:2}),cell(P("Fotos",{bold:true}),WE[2],{fill:GREY})]}),
      ...R.events.map(e=>new TableRow({cantSplit:e.photos.length<3,children:[cell(P(e.zeit),WE[0]),cell(paras(e.text),WE[1]),photoCell(e.photos,WE[2])]}))]}));
  }

      new TableRow({tableHeader:true,children:[cell(P("Mängel/Anmerkungen Stadion/Betrieb:",{bold:true}),WM[0]+WM[1],{fill:GREY,span:2}),cell(P("Fotos",{bold:true}),WM[2],{fill:GREY})]}),
      ...R.maengel.map((m,i)=>new TableRow({cantSplit:m.photos.length<3,children:[cell(P(String(i+1)),WM[0]),cell(paras(m.text),WM[1]),photoCell(m.photos,WM[2])]}))]}));
  }
  if(R.photos.length){

    });
  }

    const WA=[700,5338,1400,2200];const sz=n=>n>=1048576?(n/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1024))+" KB";

function buildPdf(R,jsPDF){
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const PW=210,PH=297,ML=20,MR=20,CW=PW-ML-MR,TOP=34,BOT=20;
  const fmt=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return d+"."+m+"."+y};
  const g=R.game,gegner=(g.gegner||"").trim()||"—";
  const GREY=[232,234,237],LINE=[128,128,128];
  const base={theme:"grid",margin:{left:ML,right:MR,top:TOP,bottom:BOT},
    styles:{font:"helvetica",fontSize:9.5,textColor:[0,0,0],lineColor:LINE,lineWidth:0.2,cellPadding:{top:1.6,bottom:1.6,left:2,right:2},overflow:"linebreak",valign:"top"},
    headStyles:{fillColor:GREY,textColor:[0,0,0],fontStyle:"bold"}};
  let y=TOP+2;
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("Einsatzbericht Heimspiel",ML,y+4);y+=10;
  const after=()=>doc.lastAutoTable.finalY+5;
  const C0={fillColor:GREY,fontStyle:"bold",cellWidth:52};
  doc.autoTable(Object.assign({},base,{startY:y,
    body:[[{content:"Begegnung:",styles:C0},{content:"SC Kriens  vs.  "+gegner,colSpan:2,styles:{fontStyle:"bold"}}],
      [{content:"Datum/Zeit:",styles:C0},fmt(g.datum),g.zeit?g.zeit+" Uhr":""],
      [{content:"Resultat:",styles:C0},g.resultat||"",""],
      [{content:"Anzahl Zuschauer (Total):",styles:C0},g.zuschauer||"",g.gast?"(davon Gast) ca. "+g.gast:""],
      [{content:"Wetter:",styles:C0},g.wetter||"",""],
      [{content:"Inspektion:",styles:C0},g.inspektion||"",g.inspektion==="gemeldet"?[[g.inspName,g.inspVorname].filter(Boolean).join(" "),g.inspMail].filter(Boolean).join("\n"):""]],
    columnStyles:{1:{cellWidth:62}}}));
  y=after();
  [["ausgangslage","Ausgangslage:"],["briefing","Briefing/Informationen:"],["anreise","Anreise:"],["spiel","während dem Spiel:"],["halbzeit","Rapport Halbzeit:"],["abreise","nach dem Spiel / Abreise:"],["bemerkungen","Bemerkungen:"]].forEach(([k,l])=>{
    doc.autoTable(Object.assign({},base,{startY:y,head:[[l]],body:[[R.texts[k]||" "]],rowPageBreak:"avoid"}));y=after();});
  doc.autoTable(Object.assign({},base,{startY:y,body:[["Datum: "+fmt(R.berichtDatum)+"      "+(R.verfasser||"")]]}));y=after();
  // photo tables
  const PHW=44,TH=30,GAP=1.5;
  const thumbs=ps=>ps.map(p=>{let h=TH,w=p.w*h/p.h;if(w>PHW-4){w=PHW-4;h=p.h*w/p.w}return{p,w,h}});
  const photoTable=(title,firstW,rows)=>{
    const body=rows.map(r=>{const th=thumbs(r.photos);const need=th.reduce((s,t)=>s+t.h+GAP,0)+3;
      return [r.a,r.b,{content:"",styles:{minCellHeight:th.length?need:0},_th:th}]});
    const first=Math.max(14,body.length?body[0][2].styles.minCellHeight:0);
    if(y+9+first>PH-BOT){doc.addPage();y=TOP+2}
    doc.autoTable(Object.assign({},base,{startY:y,rowPageBreak:"avoid",
      head:[[{content:title,colSpan:2},"Fotos"]],body,
      columnStyles:{0:{cellWidth:firstW},2:{cellWidth:PHW}},
      didDrawCell:d=>{if(d.section!=="body"||d.column.index!==2)return;const th=d.cell.raw&&d.cell.raw._th;if(!th)return;
        let yy=d.cell.y+1.5;th.forEach(t=>{try{doc.addImage(t.p.src,"JPEG",d.cell.x+2,yy,t.w,t.h)}catch(e){}yy+=t.h+GAP})}}));
    y=after();};
  if(R.events.length)photoTable("Ereignisse:",24,R.events.map(e=>({a:e.zeit||"",b:e.text||"",photos:e.photos})));
  if(R.maengel.length)photoTable("Mängel/Anmerkungen Stadion/Betrieb:",11,R.maengel.map((m,i)=>({a:String(i+1),b:m.text||"",photos:m.photos})));
  if(R.photos.length){
    doc.addPage();y=TOP+2;doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text("Fotodokumentation",ML,y+4);y+=10;
    R.photos.forEach((p,i)=>{let w=CW,h=p.h*w/p.w;if(h>115){h=115;w=p.w*h/p.h}
      if(y+h+8>PH-BOT){doc.addPage();y=TOP+2}
      try{doc.addImage(p.src,"JPEG",ML,y,w,h)}catch(e){}
      y+=h+4.5;doc.setFont("helvetica","italic");doc.setFontSize(8.5);doc.text("Bild "+(i+1)+(p.caption?": "+p.caption:""),ML,y,{maxWidth:CW});y+=8;});
  }
  const atts=R.attachments||[];
  if(atts.length){
    doc.addPage();y=TOP+2;doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text("Anhänge",ML,y+4);y+=10;
    const sz=n=>n>=1048576?(n/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1024))+" KB";
    const isPdf=a=>a.type==="application/pdf"||/\.pdf$/i.test(a.name||"");
    doc.autoTable(Object.assign({},base,{startY:y,head:[["Nr.","Datei","Grösse","Hinweis"]],
      body:atts.map((a,i)=>[String(i+1),a.name,sz(a.size),(a.img||isPdf(a))?"hinten angehängt":"separate Datei"]),
      columnStyles:{0:{cellWidth:12},2:{cellWidth:22},3:{cellWidth:34}}}));
    atts.forEach((a,i)=>{if(!a.img)return;doc.addPage();y=TOP+2;
      doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Anhang "+(i+1)+": "+a.name,ML,y+4,{maxWidth:CW});y+=10;
      const maxH=PH-BOT-y-4;let w=CW,h=a.img.h*w/a.img.w;if(h>maxH){h=maxH;w=a.img.w*h/a.img.h}
      try{doc.addImage(a.img.src,"JPEG",ML,y,w,h)}catch(e){}});
  }
  // header + footer on every page
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);
    try{doc.addImage(LOGO,"JPEG",ML,10,14.3,16.7)}catch(e){}
    doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("SC Kriens",PW-MR,15,{align:"right"});
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(85,85,85);
    doc.text("Horwerstrasse 24a · 6011 Kriens",PW-MR,19,{align:"right"});
    doc.text("041 322 16 16 · info@sckriens.ch · sckriens.ch",PW-MR,22.5,{align:"right"});
    doc.setFontSize(8);doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");const t1="INTEGRAL SECURITY & SAFETY GmbH";doc.text(t1,ML,PH-10);
    const w1=doc.getTextWidth(t1);doc.setFont("helvetica","normal");doc.setTextColor(85,85,85);doc.text(" · Matthof 8 · 6208 Oberkirch",ML+w1,PH-10);
    doc.text("Seite "+i+" / "+n,PW-MR,PH-10,{align:"right"});}
  doc.setProperties({title:"Einsatzbericht SC Kriens vs. "+gegner,author:R.verfasser||""});
  return doc.output("blob");
}
/*PDF-END*/

const MIME={pdf:"application/pdf",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",json:"application/json"};
function dlFile(file){const url=URL.createObjectURL(file);const a=document.createElement("a");a.href=url;a.download=file.name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function readySheet(file,label){
  $("#sheetPan").innerHTML=`<div class="row"><h2 style="flex:1">${esc(label)} bereit</h2></div><div class="hint">${esc(file.name)}</div>
  <button class="btn pri" type="button" id="rdShare">Teilen / In Dateien sichern</button><button class="btn" type="button" id="rdDl">Herunterladen</button><button class="btn ghost" type="button" id="rdX">Schliessen</button>`;
  $("#sheet").hidden=false;
  $("#rdShare").onclick=async()=>{try{await navigator.share({files:[file]});$("#sheet").hidden=true}catch(e){if(!e||e.name!=="AbortError")toast("Teilen nicht möglich. Bitte „Herunterladen“ verwenden.")}};
  $("#rdDl").onclick=()=>{dlFile(file);$("#sheet").hidden=true;toast(label+" heruntergeladen.")};
  $("#rdX").onclick=()=>{$("#sheet").hidden=true}}
async function saveBlob(filename,blob,label){
  const ext=(filename.split(".").pop()||"").toLowerCase();
  const file=new File([blob],filename,{type:blob.type||MIME[ext]||"application/octet-stream"});
  const touchDev=window.matchMedia&&matchMedia("(pointer:coarse)").matches;
  if(touchDev&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});toast(label+" gesichert.");return true}
    catch(e){if(e&&e.name==="AbortError"){toast("Abgebrochen.");return false}readySheet(file,label);return true}}
  try{dlFile(file);toast(label+" heruntergeladen.");return true}catch(e){toast("Speichern nicht möglich.");return false}
}

async function appendPdfs(blob,atts){const L=window.PDFLib;const skipped=[];
  const main=await L.PDFDocument.load(await blob.arrayBuffer());
  for(const a of atts){try{const src=await L.PDFDocument.load(b64ToBytes(a.data),{ignoreEncryption:true});
    const pages=await main.copyPages(src,src.getPageIndices());pages.forEach(pg=>main.addPage(pg))}catch(e){skipped.push(a.name)}}
  const bytes=await main.save();return {blob:new Blob([bytes],{type:"application/pdf"}),skipped}}
async function exportAs(kind,btn){
  const isPdf=kind==="pdf";
  if(isPdf&&!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable)){toast("PDF-Baustein nicht geladen. App neu laden.");return}
  if(!isPdf&&!window.docx){toast("Word-Baustein nicht geladen. App neu laden.");return}
  const label=btn.textContent;btn.disabled=true;btn.textContent="Erstelle …";
  try{await dbPut(R);let blob,note="";
    if(isPdf){blob=buildPdf(R,window.jspdf.jsPDF);const pdfs=R.attachments.filter(isPdfAtt);
      if(pdfs.length){if(window.PDFLib){const r=await appendPdfs(blob,pdfs);blob=r.blob;if(r.skipped.length)note=" Nicht angehängt: "+r.skipped.join(", ")+"."}
        else note=" PDF-Anhänge konnten nicht angehängt werden (Baustein nicht geladen)."}}
    else blob=await docx.Packer.toBlob(buildDocx(R,docx));
    const ok=await saveBlob(fileName(isPdf?"pdf":"docx"),blob,isPdf?"PDF":"Word-Bericht");
    if(ok&&note)setTimeout(()=>toast(note.trim()),3400);
  }catch(err){console.error(err);toast("Bericht konnte nicht erstellt werden.")}
  finally{btn.disabled=false;btn.textContent=label}
}
$("#btnPdf").addEventListener("click",e=>exportAs("pdf",e.currentTarget));
$("#btnExport").addEventListener("click",e=>exportAs("docx",e.currentTarget));

    Promise.all([navigator.storage.persisted?navigator.storage.persisted():false,navigator.storage.estimate?navigator.storage.estimate():null]).then(function(r){
      var p=r[0],e=r[1];el.textContent=(e?"Belegt: "+(e.usage/1048576).toFixed(1).replace(".",",")+" MB. ":"")+(p?"Daten sind vor automatischem Löschen geschützt.":"Der Browser kann die Daten bei Speichermangel löschen. Regelmässig eine Sicherung exportieren.")}).catch(function(){})}
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(function(p){if(!p)return navigator.storage.persist()}).catch(function(){})}
  var badge=document.getElementById("netBadge");function net(){badge.hidden=navigator.onLine}

    var hadCtl=!!navigator.serviceWorker.controller,reloading=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(!hadCtl){hadCtl=true;return}if(reloading)return;reloading=true;location.reload()});
    document.getElementById("updBtn").addEventListener("click",function(){navigator.serviceWorker.getRegistration().then(function(reg){if(reg&&reg.waiting)reg.waiting.postMessage("skip");else location.reload()})});
  }
})();
